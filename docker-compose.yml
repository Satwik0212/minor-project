services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swm_ics}
      POSTGRES_USER: ${POSTGRES_USER:-swm_ics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_development}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["swm_ics_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Add API, broker and worker services after secrets and health checks are configured.
volumes:
  swm_ics_pgdata:
