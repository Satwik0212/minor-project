services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swm_ics}
      POSTGRES_USER: ${POSTGRES_USER:-swm_ics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_development}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["swm_ics_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./infra/mqtt/mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  swm_ics_pgdata:
