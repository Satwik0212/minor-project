[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "swm-ics-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pydantic>=2.8", "pydantic-settings>=2.4", "alembic>=1.13", "firebase-admin>=6.5", "paho-mqtt>=2.1", "jsonschema>=4.23", "httpx>=0.27", "ortools>=9.10", "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "xgboost>=2.1"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
